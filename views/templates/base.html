<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Excel Preview{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        h1 { color: #333; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 1.5rem; background: #fafafa; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; background: white; }
        th, td { border: 1px solid #ccc; padding: 0.5rem 0.75rem; text-align: left; }
        th { background: #eef; }
        .flash { background: #fee; border: 1px solid #f99; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; }
        .btn { display: inline-block; background: #2c6fdc; color: white; padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none; border: none; cursor: pointer; }
        input[type=file] { margin: 1rem 0; }
    </style>
</head>
<body>
    <h1>{% block header %}Vista previa de Excel{% endblock %}</h1>
    {% with messages = get_flashed_messages() %}
        {% for msg in messages %}<div class="flash">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</body>
</html>
