{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2 style="margin-top:0;">Cargar informe</h2>
    <p>Suba un archivo Excel (.xlsx o .xls) con el informe a revisar. Se mostrarán las primeras 5 filas con su encabezado para validar el contenido antes de procesarlo.</p>
    <form action="{{ url_for('excel.upload') }}" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept=".xlsx,.xls" required>
        <br>
        <button type="submit" class="btn">Subir y previsualizar</button>
    </form>
</div>
{% endblock %}
