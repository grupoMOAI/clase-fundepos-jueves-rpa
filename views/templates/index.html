{% extends "base.html" %}
{% block content %}
<div class="card">
    <p>Suba un archivo Excel (.xlsx o .xls) para ver las primeras 5 filas.</p>
    <form action="{{ url_for('excel.upload') }}" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept=".xlsx,.xls" required>
        <br>
        <button type="submit" class="btn">Subir y previsualizar</button>
    </form>
</div>
{% endblock %}
